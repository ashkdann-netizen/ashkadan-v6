<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>درخواست‌های پروژه | اشکادان</title><style>body{margin:0;background:#0b0b0b;color:#f7f2e9;font:15px Tahoma,sans-serif;line-height:1.9}.wrap{max-width:1000px;margin:35px auto;padding:20px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{color:#e8c78e;font-size:24px}.muted{color:#aaa}.item{border:1px solid #6f552e;background:#141311;padding:16px;margin:12px 0;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.detail{white-space:pre-wrap;border-top:1px solid #ffffff20;margin-top:10px;padding-top:10px}.btn{border:1px solid #b88b49;background:#d6a65c;color:#17120a;padding:9px 14px;cursor:pointer;border-radius:5px}.btn:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;gap:10px;margin-top:20px}.error{color:#ff9a9a}@media(max-width:600px){.wrap{padding:14px;margin:12px auto}}</style></head><body><main class="wrap"><div class="head"><div><h1>درخواست‌های اجرای پروژه</h1><div class="muted" id="status">در حال بررسی نشست مدیر…</div></div><button type="button" class="btn" id="refresh">به‌روزرسانی</button></div><section id="items"></section><div class="actions"><button type="button" class="btn" id="prev" disabled>صفحه قبل</button><button type="button" class="btn" id="next" disabled>درخواست‌های قدیمی‌تر</button></div></main><script>const $=id=>document.getElementById(id);let cursorStack=[],cursor=null;async function load(next){if(next!==undefined)cursor=next;$('status').textContent='در حال دریافت درخواست‌ها…';try{const auth=await fetch('/api/admin/session',{credentials:'same-origin',cache:'no-store'});if(!auth.ok)throw new Error('نشست مدیر معتبر نیست. ابتدا در پنل اصلی وارد شوید و دوباره این صفحه را باز کنید.');const url='/api/inquiries?limit=50'+(cursor?'&cursor='+encodeURIComponent(cursor):'');const r=await fetch(url,{credentials:'same-origin',cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||'دریافت اطلاعات ناموفق بود.');$('items').innerHTML='';for(const x of j.items||[]){const card=document.createElement('article');card.className='item';const grid=document.createElement('div');grid.className='grid';[['نام',x.name+' '+(x.surname||'')],['تلفن',x.phone],['شهر',x.city],['نوع پروژه',x.kind],['تاریخ',new Date(x.createdAt).toLocaleString('fa-IR')]].forEach(([k,v])=>{const d=document.createElement('div');d.textContent=k+': '+(v||'');grid.append(d)});card.append(grid);if(x.details){const d=document.createElement('div');d.className='detail';d.textContent=x.details;card.append(d)}$('items').append(card)}if(!j.items?.length)$('items').textContent='در این صفحه درخواستی وجود ندارد.';$('status').textContent=(j.items||[]).length+' درخواست نمایش داده شد.';$('next').disabled=!j.nextCursor;$('prev').disabled=cursorStack.length===0;window.currentNext=j.nextCursor||null}catch(e){$('status').textContent=e.message;$('status').className='error';$('items').innerHTML=''}}$('next').onclick=()=>{if(window.currentNext){cursorStack.push(cursor);load(window.currentNext)}};$('prev').onclick=()=>load(cursorStack.pop()||null);$('refresh').onclick=()=>load(cursor);load(null);</script></body></html>
